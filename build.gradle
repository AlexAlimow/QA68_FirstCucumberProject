plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.37.0'
    implementation 'io.github.bonigarcia:webdrivermanager:6.3.2'
    implementation 'io.cucumber:cucumber-java:7.30.0'
    implementation 'io.cucumber:cucumber-junit:7.30.0'
}

test {
    useJUnit()
    systemProperty("cucumber.filter.tags", System.getProperty("cucumber.filter.tags"))
}